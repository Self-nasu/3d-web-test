name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - name: Vendor Three.js (MIT)
        run: |
          mkdir -p vendor && npm pack three@0.160.0 --silent && tar xzf three-0.160.0.tgz
          cp package/build/three.module.js vendor/ && rm -rf package three-0.160.0.tgz
      - name: Bake real terrain (AWS DEM + Sentinel-2)
        continue-on-error: true
        run: python3 tools/build_terrain.py
      - name: Fetch credited photos (Wikimedia Commons)
        continue-on-error: true
        run: python3 tools/fetch_commons.py && python3 tools/build_credits.py
      - name: Assemble site
        run: |
          mkdir dist && cp -r index.html css js data assets vendor dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
